<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#52796f">

  <title>قائمة مهامي</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0 10px;
      background: #f1f5f0;
      color: #263832;
      font-family: Arial, sans-serif;
    }

    #head {
      font-size: 40px;
      text-align: center;
    }

    #inputs {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 15px;
    }

    #inputs input {
      height: 25px;
      width: 230px;
      min-width: 0;
      border: 1px solid #52796f;
      border-radius: 6px;
      padding: 3px 6px;
    }

    #inputs button {
      height: 25px;
      width: 60px;
      border: none;
      border-radius: 6px;
      background: #52796f;
      color: white;
      cursor: pointer;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      min-height: 37px;
      margin: 3px 0;
      padding: 4px;
      background: white;
      border: 1px solid #52796f;
      border-radius: 6px;
    }

    .task p {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    /* المسافة بين edit و done */
    .buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* أزرار المهام */
    .task button {
      height: 29px;
      width: 50px;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    .edit {
      background: #52796f;
    }

    .done {
      background: #bc4749;
    }

    /* زر تغيير مكان المهمة */
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      min-width: 20px;
      padding: 0;
      border: none;
      background: transparent;
      color: #52796f;
      font-size: 18px;
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .task.dragging {
      opacity: 0.45;
    }

    /* رسالة حذف المهمة */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: #263832;
      color: white;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s;
      z-index: 1000;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>
  <h1 id="head">قائمة مهامي</h1>

  <div id="inputs">
    <input type="text" id="newT" placeholder="اكتب المهمة">
    <button id="enter">Enter</button>
  </div>

  <div id="All"></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const newT = document.getElementById("newT");
    const enter = document.getElementById("enter");
    const All = document.getElementById("All");
    const toast = document.getElementById("toast");

    let dataBase = [];
    let toastTimer;

    // قراءة المهام المحفوظة
    try {
      const savedData = JSON.parse(localStorage.getItem("dataBase"));

      if (Array.isArray(savedData)) {
        dataBase = savedData
          .map((task, index) => {
            if (typeof task === "string") {
              return {
                id: `${Date.now()}-${index}`,
                title: task
              };
            }

            if (task && typeof task.title === "string") {
              return {
                id: task.id ?? `${Date.now()}-${index}`,
                title: task.title
              };
            }

            return null;
          })
          .filter(Boolean);
      }
    } catch (error) {
      dataBase = [];
    }

    function saveData() {
      localStorage.setItem("dataBase", JSON.stringify(dataBase));
    }

    // إظهار رسالة مؤقتة
    function showToast(message) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // إضافة مهمة
    function addTask() {
      const title = newT.value.trim();

      if (title === "") {
        return;
      }

      dataBase.push({
        id: `${Date.now()}-${Math.random()}`,
        title: title
      });

      saveData();
      show();

      newT.value = "";
      newT.focus();
    }

    enter.addEventListener("click", addTask);

    newT.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    // تعديل مهمة
    function editTask(id) {
      const task = dataBase.find(item => item.id === id);

      if (!task) {
        return;
      }

      const updatedTitle = prompt("Edit task:", task.title);

      if (updatedTitle === null) {
        return;
      }

      const cleanedTitle = updatedTitle.trim();

      if (cleanedTitle === "") {
        return;
      }

      task.title = cleanedTitle;

      saveData();
      show();
    }

    // حذف مهمة
    function deleteTask(id) {
      const task = dataBase.find(item => item.id === id);

      if (!task) {
        return;
      }

      const deletedTitle = task.title;

      dataBase = dataBase.filter(item => item.id !== id);

      saveData();
      show();

      showToast(`تم حذف المهمة: ${deletedTitle}`);
    }

    // عرض المهام
    function show() {
      All.replaceChildren();

      dataBase.forEach(task => {
        const row = document.createElement("div");
        row.className = "task";
        row.dataset.id = task.id;

        // زر السحب
        const handle = document.createElement("button");
        handle.className = "drag-handle";
        handle.type = "button";
        handle.textContent = "⋮⋮";
        handle.setAttribute("aria-label", "تغيير مكان المهمة");

        // اسم المهمة
        const text = document.createElement("p");
        text.textContent = task.title;

        // مجموعة الأزرار
        const buttons = document.createElement("div");
        buttons.className = "buttons";

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.textContent = "edit";
        editButton.type = "button";

        editButton.addEventListener("click", () => {
          editTask(task.id);
        });

        const doneButton = document.createElement("button");
        doneButton.className = "done";
        doneButton.textContent = "done";
        doneButton.type = "button";

        doneButton.addEventListener("click", () => {
          deleteTask(task.id);
        });

        buttons.append(editButton, doneButton);

        // في اتجاه RTL يظهر زر السحب قبل اسم المهمة
        row.append(handle, text, buttons);

        All.appendChild(row);

        setupDragging(handle, row);
      });
    }

    // سحب المهام لتغيير ترتيبها
    function setupDragging(handle, row) {
      handle.addEventListener("pointerdown", event => {
        if (event.button !== 0 && event.pointerType === "mouse") {
          return;
        }

        event.preventDefault();

        const startY = event.clientY;
        let dragging = false;

        function onMove(moveEvent) {
          const distance = Math.abs(moveEvent.clientY - startY);

          if (!dragging && distance < 5) {
            return;
          }

          if (!dragging) {
            dragging = true;
            row.classList.add("dragging");
          }

          const otherRows = [
            ...All.querySelectorAll(".task:not(.dragging)")
          ];

          let closestRow = null;
          let closestDistance = Number.NEGATIVE_INFINITY;

          otherRows.forEach(otherRow => {
            const rect = otherRow.getBoundingClientRect();
            const offset =
              moveEvent.clientY - (rect.top + rect.height / 2);

            if (offset < 0 && offset > closestDistance) {
              closestDistance = offset;
              closestRow = otherRow;
            }
          });

          if (closestRow) {
            All.insertBefore(row, closestRow);
          } else {
            All.appendChild(row);
          }
        }

        function onUp() {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);

          row.classList.remove("dragging");

          if (dragging) {
            const newOrder = [
              ...All.querySelectorAll(".task")
            ].map(item => item.dataset.id);

            dataBase.sort((a, b) => {
              return newOrder.indexOf(a.id) - newOrder.indexOf(b.id);
            });

            saveData();
          }
        }

        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    }

    show();

    // تسجيل Service Worker لتشغيل الموقع كتطبيق PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(error => {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
