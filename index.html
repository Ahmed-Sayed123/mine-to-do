<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <title>قائمة مهامي</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#52796f" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="مهامي" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f1f5f0;
        margin: 0 10px;
      }

      #head {
        font-size: 40px;
        margin-bottom: 7px;
        font-weight: 600;
        color: #263832;
      }

      label {
        font-size: 18px;
        color: #263832;
      }

      #inputs input {
        height: 25px;
        width: 230px;
        border-radius: 7px;
        border: none;
        padding: 3px;
        margin-left: 5px;
        background-color: #ffffff;
        color: #263832;
      }

      #inputs input:focus {
        outline: 2px solid #52796f;
        outline-offset: 1px;
      }

      #inputs button {
        height: 25px;
        width: 60px;
        margin-top: 5px;
        border-radius: 5px;
        margin-bottom: 15px;
      }

      button:active {
        scale: 0.9;
      }

      #current {
        font-size: 28px;
        margin-top: 8px;
        color: #263832;
      }

      hr {
        border: none;
        border-top: 2px solid #a3b5a8;
        margin-bottom: 7px;
      }

      .task {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 5px;
        border: #d5ded7 solid 1px;
        padding: 4px;
        background-color: #fff;
        border-radius: 6px;
        min-height: 37px;
        margin: 3px 0;
        color: #263832;
      }

      .task p {
        font-size: 17px;
        overflow-wrap: anywhere;
        flex: 1;
        min-width: 0;
      }

      .task button {
        height: 27px;
        min-width: 45px;
        border-radius: 3px;
      }

      #alertMessage {
        color: #b42318;
        margin: 2px;
        font-size: 13px;
      }

      button {
        background-color: #52796f;
        color: #ffffff;
        border: 1px solid #3d6258;
        cursor: pointer;
      }

      .btns {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .drag-handle {
        width: 20px;
        min-width: 20px;
        height: 27px;
        padding: 0;
        background: transparent;
        color: #52796f;
        border: none;
        font-size: 18px;
        cursor: grab;
        touch-action: none;
        user-select: none;
        flex-shrink: 0;
      }

      .drag-handle:active {
        cursor: grabbing;
        scale: 1;
      }

      .task.dragging {
        opacity: 0.4;
      }

      .task.drag-over {
        border-top: 3px solid #52796f;
      }

      #toast {
        position: fixed;
        bottom: 15px;
        right: 50%;
        transform: translateX(50%) translateY(15px);
        max-width: calc(100% - 30px);
        width: max-content;
        padding: 10px 15px;
        border-radius: 8px;
        background: #263832;
        color: #fff;
        font-size: 14px;
        opacity: 0;
        visibility: hidden;
        transition: 0.25s;
        z-index: 1000;
        overflow-wrap: anywhere;
      }

      #toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(50%) translateY(0);
      }

      @media (max-width: 380px) {
        .task {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <h2 id="head">قائمة المهام</h2>
    <hr />

    <div id="inputs">
      <label for="name">ادخل اسم المهمة</label><br />
      <small id="alertMessage"></small><br />
      <input type="text" id="name" placeholder="اسم المهمة" />
      <button id="enter" type="button">Enter</button>
    </div>

    <p id="current">المهام الحالية</p>
    <div id="outputs"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const newT = document.getElementById("name");
      const enter = document.getElementById("enter");
      const All = document.getElementById("outputs");
      const alertMessage = document.getElementById("alertMessage");
      const toast = document.getElementById("toast");

      let mode = "add";
      let editingId = null;
      let toastTimer;

      // إنشاء معرف فريد لكل مهمة
      function makeId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      // تحميل البيانات القديمة والجديدة
      function loadData() {
        try {
          const saved = localStorage.getItem("dataBase");

          if (saved === null) return [];

          const parsed = JSON.parse(saved);

          if (!Array.isArray(parsed)) return [];

          const tasks = [];
          const ids = new Set();

          for (const item of parsed) {
            let task;

            if (typeof item === "string") {
              task = {
                id: makeId(),
                title: item,
              };
            } else if (
              item &&
              typeof item === "object" &&
              !Array.isArray(item) &&
              typeof item.title === "string"
            ) {
              task = {
                id:
                  typeof item.id === "string" && item.id.length > 0
                    ? item.id
                    : makeId(),
                title: item.title,
              };
            } else {
              continue;
            }

            if (ids.has(task.id)) {
              task.id = makeId();
            }

            ids.add(task.id);
            tasks.push(task);
          }

          return tasks;
        } catch (error) {
          console.error("Failed to load tasks:", error);
          return [];
        }
      }

      let data = loadData();

      // حفظ البيانات
      function saveData() {
        try {
          localStorage.setItem("dataBase", JSON.stringify(data));
          return true;
        } catch (error) {
          console.error("Failed to save tasks:", error);
          showToast("Failed to save tasks");
          return false;
        }
      }

      // إشعار انتهاء المهمة
      function showToast(title) {
        clearTimeout(toastTimer);

        toast.textContent = `✓ ${title}`;
        toast.classList.add("show");

        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 3000);
      }

      // إضافة أو تعديل مهمة
      function addOrEdit() {
        const title = newT.value.trim();

        if (title === "") {
          newT.style.border = "#B42318 solid 2px";
          alertMessage.textContent = "required field";
          return;
        }

        if (mode === "add") {
          data.push({
            id: makeId(),
            title: title,
          });
        } else {
          const index = data.findIndex(function (task) {
            return task.id === editingId;
          });

          if (index === -1) {
            resetForm();
            show();
            return;
          }

          data[index].title = title;
        }

        if (saveData()) {
          resetForm();
        }

        show();
      }

      enter.addEventListener("click", addOrEdit);

      newT.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          addOrEdit();
        }
      });

      newT.addEventListener("input", function () {
        newT.style.border = "none";
        alertMessage.textContent = "";
      });

      // إعادة وضع الإضافة بعد الحفظ
      function resetForm() {
        newT.value = "";
        editingId = null;
        mode = "add";
        enter.textContent = "Enter";
        alertMessage.textContent = "";
        newT.style.border = "none";
      }

      // تعديل مهمة
      function editTask(id) {
        const task = data.find(function (item) {
          return item.id === id;
        });

        if (!task) return;

        newT.value = task.title;
        editingId = id;
        mode = "edit";
        enter.textContent = "edit";

        window.scrollTo(0, 0);
        newT.focus();
      }

      // حذف المهمة عند الضغط على done
      function deleteTask(id) {
        const index = data.findIndex(function (task) {
          return task.id === id;
        });

        if (index === -1) return;

        const completedTitle = data[index].title;

        data.splice(index, 1);

        if (editingId === id) {
          resetForm();
        }

        if (saveData()) {
          showToast(`تم انهاء المهمة: ${completedTitle}`);
        }

        show();
      }

      // عرض المهام بطريقة آمنة
      function show() {
        All.replaceChildren();

        data.forEach(function (task, index) {
          const row = document.createElement("div");
          row.className = "task";
          row.dataset.id = task.id;

          const text = document.createElement("p");
          text.textContent = task.title;

          const buttons = document.createElement("div");
          buttons.className = "btns";

          // علامة سحب لترتيب المهام
          const handle = document.createElement("button");
          handle.type = "button";
          handle.className = "drag-handle";
          handle.textContent = "⋮⋮";
          handle.title = "Reorder";
          handle.setAttribute("aria-label", "Reorder task");

          // زر التعديل
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "edit";

          editButton.addEventListener("click", function () {
            editTask(task.id);
          });

          // زر إكمال المهمة وحذفها
          const doneButton = document.createElement("button");
          doneButton.type = "button";
          doneButton.textContent = "done";

          doneButton.addEventListener("click", function () {
            deleteTask(task.id);
          });

          buttons.append(editButton, doneButton);
          row.append(handle, text, buttons);
          All.appendChild(row);

          setupDragging(row, handle);
        });
      }

      // السحب بالماوس أو اللمس باستخدام Pointer Events
      let dragState = null;

      function setupDragging(row, handle) {
        handle.addEventListener("pointerdown", function (event) {
          if (event.button !== 0 && event.pointerType === "mouse") {
            return;
          }

          event.preventDefault();

          const rows = [...All.querySelectorAll(".task")];

          dragState = {
            row: row,
            startY: event.clientY,
            lastY: event.clientY,
            moved: false,
          };

          row.classList.add("dragging");

          try {
            handle.setPointerCapture(event.pointerId);
          } catch (error) {}

          function onMove(e) {
            if (!dragState || dragState.row !== row) return;

            dragState.lastY = e.clientY;

            if (Math.abs(e.clientY - dragState.startY) > 5) {
              dragState.moved = true;
            }

            if (!dragState.moved) return;

            const siblings = [...All.querySelectorAll(".task:not(.dragging)")];

            let target = null;

            for (const sibling of siblings) {
              const rect = sibling.getBoundingClientRect();
              const midpoint = rect.top + rect.height / 2;

              if (e.clientY < midpoint) {
                target = sibling;
                break;
              }
            }

            All.querySelectorAll(".drag-over").forEach(function (item) {
              item.classList.remove("drag-over");
            });

            if (target) {
              target.classList.add("drag-over");
              All.insertBefore(row, target);
            } else {
              All.appendChild(row);
            }
          }

          function onUp() {
            if (!dragState || dragState.row !== row) return;

            row.classList.remove("dragging");

            All.querySelectorAll(".drag-over").forEach(function (item) {
              item.classList.remove("drag-over");
            });

            if (dragState.moved) {
              const orderedIds = [...All.querySelectorAll(".task")].map(
                function (item) {
                  return item.dataset.id;
                },
              );

              const reordered = orderedIds
                .map(function (id) {
                  return data.find(function (task) {
                    return task.id === id;
                  });
                })
                .filter(Boolean);

              data = reordered;
              saveData();
            }

            dragState = null;

            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onUp);
          }

          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onUp);
        });
      }

      // بدء التطبيق
      show();

      // تسجيل Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (error) {
            console.error("Service Worker error:", error);
          });
        });
      }
    </script>
  </body>
</html>
